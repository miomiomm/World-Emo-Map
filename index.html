const genreColors = {
  "Emocore": "#ff006e", "Midwest": "#00f5d4", "Screamo": "#e63946",
  "Emo-Pop": "#ffbe0b", "Pop-Punk": "#fb5607", "Post-HC": "#8338ec",
  "Math": "#06ffa5", "Indie": "#3a86ff", "Revival": "#ff006e"
};

let yearMin = 1983, yearMax = 2025;
let selectedGenres = new Set(["all"]);
let activeCity = null;

const canvas = document.getElementById("worldMap");
const ctx = canvas.getContext("2d");
let canvasW, canvasH;
let geojsonData = null;
let cityMarkers = [];
let hoveredCity = null;
let animFrame = 0;

function resizeCanvas() {
  var container = document.getElementById("mapContainer");
  canvasW = container.clientWidth;
  canvasH = container.clientHeight;
  canvas.width = canvasW;
  canvas.height = canvasH;
  renderFrame();
}

function lngLatToPixel(lng, lat) {
  var x = ((lng + 180) / 360) * canvasW;
  var y = ((90 - lat) / 180) * canvasH;
  return { x: x, y: y };
}

function drawGraticule() {
  ctx.strokeStyle = "rgba(162,210,238,0.25)";
  ctx.lineWidth = 0.5;
  for (var lng = -180; lng <= 180; lng += 30) {
    ctx.beginPath();
    for (var lat = -80; lat <= 80; lat += 5) {
      var p = lngLatToPixel(lng, lat);
      if (lat === -80) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  for (var lat = -60; lat <= 80; lat += 30) {
    ctx.beginPath();
    for (var lng = -180; lng <= 180; lng += 5) {
      var p = lngLatToPixel(lng, lat);
      if (lng === -180) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
}

function drawPolygon(rings, isChina) {
  ctx.beginPath();
  rings.forEach(function(ring) {
    ring.forEach(function(pt, index) {
      var lng = pt[0], lat = pt[1];
      var p = lngLatToPixel(lng, lat);
      if (index === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
  });
  if (isChina) {
    ctx.fillStyle = "rgba(240,180,180,0.35)";
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.08)";
  }
  ctx.fill();
  ctx.strokeStyle = "rgba(64,152,215,0.5)";
  ctx.lineWidth = 0.6;
  ctx.stroke();
}

function drawMap() {
  if (!geojsonData) return;
  geojsonData.features.forEach(function(feature) {
    var geo = feature.geometry;
    var countryName = feature.properties.name;
    var isChina = countryName === "中国" || countryName === "中华人民共和国";
    if (geo.type === "Polygon") {
      drawPolygon(geo.coordinates, isChina);
    } else if (geo.type === "MultiPolygon") {
      geo.coordinates.forEach(function(polyRings) {
        drawPolygon(polyRings, isChina);
      });
    }
  });
}

function getFilteredBands() {
  return bands.filter(function(b) {
    var inYear = b.year >= yearMin && b.year <= yearMax;
    var inGenre = selectedGenres.has("all") || selectedGenres.has(b.genre);
    return inYear && inGenre;
  });
}

function getCitiesFromBands(bandList) {
  var cities = {};
  bandList.forEach(function(b) {
    if (!cities[b.city]) {
      cities[b.city] = { city: b.city, country: b.country, lat: b.lat, lng: b.lng, bands: [] };
    }
    cities[b.city].bands.push(b);
  });
  return Object.values(cities);
}

function getCityBands(city) {
  return getFilteredBands().filter(function(b) { return b.city === city; }).sort(function(a, b) { return a.year - b.year; });
}

function updateMarkers() {
  var filtered = getFilteredBands();
  var cities = getCitiesFromBands(filtered);
  cityMarkers = cities.map(function(cityData) {
    var pt = lngLatToPixel(cityData.lng, cityData.lat);
    var count = cityData.bands.length;
    var primaryGenre = cityData.bands[0].genre;
    var color = genreColors[primaryGenre] || "#ff006e";
    var radius = 4 + Math.min(count, 7) * 1.2;
    return {
      x: pt.x, y: pt.y, r: radius, color: color,
      city: cityData.city, country: cityData.country,
      bands: cityData.bands, count: count
    };
  });
  document.getElementById("stat-cities").textContent = cities.length;
  document.getElementById("stat-bands").textContent = filtered.length;
  document.getElementById("stat-range").textContent = yearMin + "–" + yearMax;
}

function drawMarkers() {
  cityMarkers.forEach(function(m) {
    var pulseR = m.r + 4 + Math.sin(animFrame * 0.05 + m.x) * 3;
    var pulseAlpha = 0.15 + Math.sin(animFrame * 0.05 + m.x) * 0.1;
    var hex = m.color.replace("#", "");
    var pr = parseInt(hex.substring(0,2), 16);
    var pg = parseInt(hex.substring(2,4), 16);
    var pb = parseInt(hex.substring(4,6), 16);
    ctx.beginPath();
    ctx.arc(m.x, m.y, pulseR, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(" + pr + "," + pg + "," + pb + "," + pulseAlpha + ")";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.stroke();
    if (hoveredCity && hoveredCity.city === m.city) {
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = m.color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = "bold 12px 'Bangers', cursive";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.shadowColor = "#000";
      ctx.shadowBlur = 4;
      ctx.fillText(m.city, m.x, m.y - m.r - 8);
      ctx.shadowBlur = 0;
    }
  });
}

function renderFrame() {
  ctx.clearRect(0, 0, canvasW, canvasH);
  drawGraticule();
  drawMap();
  drawMarkers();
}

function animate() {
  animFrame++;
  renderFrame();
  requestAnimationFrame(animate);
}

function getMousePos(evt) {
  var rect = canvas.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

function findHoveredMarker(mx, my) {
  var best = null, bestDist = Infinity;
  cityMarkers.forEach(function(m) {
    var dx = mx - m.x, dy = my - m.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < m.r + 10 && dist < bestDist) {
      bestDist = dist;
      best = m;
    }
  });
  return best;
}

canvas.addEventListener("mousemove", function(e) {
  var pos = getMousePos(e);
  hoveredCity = findHoveredMarker(pos.x, pos.y);
  if (hoveredCity) {
    canvas.style.cursor = "pointer";
    showTooltip(e, hoveredCity);
  } else {
    canvas.style.cursor = "crosshair";
    hideTooltip();
  }
});

canvas.addEventListener("mouseleave", function() {
  hoveredCity = null;
  hideTooltip();
});

canvas.addEventListener("click", function(e) {
  var pos = getMousePos(e);
  var m = findHoveredMarker(pos.x, pos.y);
  if (m) openDetail(m.city);
});

function showTooltip(e, cityData) {
  var tooltip = document.getElementById("tooltip");
  tooltip.querySelector(".tooltip-city").textContent = cityData.city + ", " + cityData.country;
  tooltip.querySelector(".tooltip-count").textContent = cityData.count + " 支乐队";
  var genreSet = {};
  cityData.bands.forEach(function(b) { genreSet[b.genre] = true; });
  var genresDiv = document.getElementById("tooltipGenres");
  genresDiv.innerHTML = "";
  Object.keys(genreSet).forEach(function(g) {
    var span = document.createElement("span");
    span.className = "tooltip-genre-tag";
    span.textContent = g;
    span.style.background = genreColors[g] || "#333";
    genresDiv.appendChild(span);
  });
  tooltip.style.left = (e.clientX + 15) + "px";
  tooltip.style.top = (e.clientY - 10) + "px";
  tooltip.classList.add("show");
}

function hideTooltip() {
  document.getElementById("tooltip").classList.remove("show");
}

function openDetail(city) {
  var cityBands = getCityBands(city);
  if (cityBands.length === 0) return;
  activeCity = city;
  var panel = document.getElementById("detailPanel");
  var firstBand = bands.find(function(b) { return b.city === city; });
  document.getElementById("detailCity").textContent = city;
  document.getElementById("detailSubtitle").textContent = firstBand.country + " · " + cityBands.length + " 支乐队";
  var content = document.getElementById("detailContent");
  content.innerHTML = cityBands.map(function(b) {
    return '<div class="band-item">' +
      '<div class="band-info">' +
        '<h4>' + b.name + '</h4>' +
        '<div class="band-meta">' +
          '<span class="band-year">' + b.year + '</span>' +
          '<span class="band-genre ' + b.genre + '">' + b.genre + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");
  panel.classList.add("open");
}

function closeDetail() {
  document.getElementById("detailPanel").classList.remove("open");
  activeCity = null;
}

function renderLegend() {
  var container = document.getElementById("legendContainer");
  var filtered = getFilteredBands();
  var genreCounts = {};
  filtered.forEach(function(b) { genreCounts[b.genre] = (genreCounts[b.genre] || 0) + 1; });
  container.innerHTML = "";
  Object.entries(genreCounts).sort(function(a, b) { return b[1] - a[1]; }).forEach(function(item) {
    var genre = item[0], count = item[1];
    var div = document.createElement("div");
    div.className = "legend-item";
    div.innerHTML = '<div class="legend-dot" style="background:' + genreColors[genre] + '"></div>' + genre + ' <span class="legend-count">' + count + '</span>';
    container.appendChild(div);
  });
}

function updateSliderFill() {
  var range = 2025 - 1983;
  var left = ((yearMin - 1983) / range) * 100;
  var width = ((yearMax - yearMin) / range) * 100;
  var fill = document.getElementById("sliderFill");
  fill.style.left = left + "%";
  fill.style.width = width + "%";
}

document.getElementById("yearMin").addEventListener("input", function() {
  yearMin = parseInt(this.value);
  if (yearMin > yearMax) {
    yearMax = yearMin;
    document.getElementById("yearMax").value = yearMax;
  }
  document.getElementById("yearMinDisplay").textContent = yearMin;
  document.getElementById("yearMaxDisplay").textContent = yearMax;
  updateSliderFill();
  updateMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

document.getElementById("yearMax").addEventListener("input", function() {
  yearMax = parseInt(this.value);
  if (yearMax < yearMin) {
    yearMin = yearMax;
    document.getElementById("yearMin").value = yearMin;
  }
  document.getElementById("yearMinDisplay").textContent = yearMin;
  document.getElementById("yearMaxDisplay").textContent = yearMax;
  updateSliderFill();
  updateMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

document.getElementById("genreFilter").addEventListener("click", function(e) {
  if (!e.target.classList.contains("genre-btn")) return;
  var genre = e.target.dataset.genre;
  if (genre === "all") {
    selectedGenres = new Set(["all"]);
    document.querySelectorAll(".genre-btn").forEach(function(btn) { btn.classList.remove("active"); });
    e.target.classList.add("active");
  } else {
    if (selectedGenres.has("all")) {
      selectedGenres.delete("all");
      document.querySelector('.genre-btn[data-genre="all"]').classList.remove("active");
    }
    if (selectedGenres.has(genre)) {
      selectedGenres.delete(genre);
      e.target.classList.remove("active");
      if (selectedGenres.size === 0) {
        selectedGenres.add("all");
        document.querySelector('.genre-btn[data-genre="all"]').classList.add("active");
      }
    } else {
      selectedGenres.add(genre);
      e.target.classList.add("active");
    }
  }
  updateMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

var sidebarOpen = false;
function toggleSidebar() {
  var sidebar = document.querySelector(".sidebar");
  sidebarOpen = !sidebarOpen;
  if (sidebarOpen) {
    sidebar.style.position = "fixed";
    sidebar.style.top = "60px";
    sidebar.style.left = "0";
    sidebar.style.right = "0";
    sidebar.style.bottom = "0";
    sidebar.style.zIndex = "80";
    sidebar.style.maxHeight = "none";
  } else {
    sidebar.style.position = "";
    sidebar.style.top = "";
    sidebar.style.left = "";
    sidebar.style.right = "";
    sidebar.style.bottom = "";
    sidebar.style.zIndex = "";
    sidebar.style.maxHeight = "220px";
  }
}

fetch("https://cdn.jsdelivr.net/npm/@surbowl/world-geo-json-zh/world.zh.json")
  .then(function(res) { return res.json(); })
  .then(function(data) {
    geojsonData = data;
    resizeCanvas();
    updateMarkers();
    renderLegend();
    animate();
  })
  .catch(function(err) {
    console.error("地图数据加载失败：", err);
    resizeCanvas();
    updateMarkers();
    renderLegend();
    animate();
  });

window.addEventListener("resize", resizeCanvas);
updateSliderFill();
</script>
</body>
</html>
