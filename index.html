<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Emo Map — 世界情绪地图</title>
<style>
:root {
  --bg: #0a0a0f;
  --panel: #12121f;
  --panel-border: #1e1e3f;
  --map-fill: #0d1b2a;
  --map-stroke: #1b3a4b;
  --text: #e0e0e0;
  --text-dim: #8888a0;
  --accent: #e94560;
  --accent-glow: rgba(233, 69, 96, 0.3);
  --Emocore: #e74c3c;
  --Midwest: #1abc9c;
  --Screamo: #c0392b;
  --Emo-Pop: #f1c40f;
  --Pop-Punk: #e67e22;
  --Post-HC: #9b59b6;
  --Math: #2ecc71;
  --Indie: #3498db;
  --Revival: #e91e63;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
.app { display: flex; flex-direction: column; height: 100vh; }
header {
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 32px; height: 32px; background: var(--accent); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.logo h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.stats { display: flex; gap: 20px; font-size: 13px; color: var(--text-dim); }
.stats strong { color: var(--text); font-size: 15px; display: block; }
.main { display: flex; flex: 1; overflow: hidden; position: relative; }
.sidebar {
  width: 280px; background: var(--panel); border-right: 1px solid var(--panel-border);
  padding: 20px; overflow-y: auto; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 24px;
}
.filter-section h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); margin-bottom: 12px;
}
.year-display {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 14px; font-weight: 600;
}
.year-display span {
  background: var(--bg); padding: 4px 10px; border-radius: 6px;
  border: 1px solid var(--panel-border); min-width: 50px; text-align: center;
}
.range-slider { position: relative; height: 30px; }
.range-slider input[type="range"] {
  position: absolute; width: 100%; height: 4px; background: transparent;
  -webkit-appearance: none; pointer-events: none;
  top: 50%; transform: translateY(-50%);
}
.range-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent);
  border-radius: 50%; cursor: pointer; pointer-events: all;
  border: 2px solid #fff; box-shadow: 0 0 10px var(--accent-glow);
}
.range-slider input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; background: var(--accent); border-radius: 50%;
  cursor: pointer; pointer-events: all; border: 2px solid #fff;
  box-shadow: 0 0 10px var(--accent-glow);
}
.slider-track {
  position: absolute; width: 100%; height: 4px;
  background: var(--panel-border); border-radius: 2px;
  top: 50%; transform: translateY(-50%);
}
.slider-fill {
  position: absolute; height: 4px; background: var(--accent);
  border-radius: 2px; top: 50%; transform: translateY(-50%);
}
.genre-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.genre-btn {
  padding: 6px 12px; border-radius: 20px; border: 1px solid var(--panel-border);
  background: var(--bg); color: var(--text-dim); font-size: 12px;
  cursor: pointer; transition: all 0.2s; user-select: none;
}
.genre-btn:hover { border-color: var(--text-dim); color: var(--text); }
.genre-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
.genre-btn[data-genre="Emocore"].active { background: var(--Emocore); border-color: var(--Emocore); }
.genre-btn[data-genre="Midwest"].active { background: var(--Midwest); border-color: var(--Midwest); }
.genre-btn[data-genre="Screamo"].active { background: var(--Screamo); border-color: var(--Screamo); }
.genre-btn[data-genre="Emo-Pop"].active { background: var(--Emo-Pop); border-color: var(--Emo-Pop); color: #000; }
.genre-btn[data-genre="Pop-Punk"].active { background: var(--Pop-Punk); border-color: var(--Pop-Punk); }
.genre-btn[data-genre="Post-HC"].active { background: var(--Post-HC); border-color: var(--Post-HC); }
.genre-btn[data-genre="Math"].active { background: var(--Math); border-color: var(--Math); color: #000; }
.genre-btn[data-genre="Indie"].active { background: var(--Indie); border-color: var(--Indie); }
.genre-btn[data-genre="Revival"].active { background: var(--Revival); border-color: var(--Revival); }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.map-container {
  flex: 1; position: relative;
  background: radial-gradient(ellipse at center, #0f1f3a 0%, var(--bg) 100%);
  overflow: hidden;
}
.map-container svg { width: 100%; height: 100%; display: block; }
.continent { fill: var(--map-fill); stroke: var(--map-stroke); stroke-width: 1; transition: fill 0.3s; }
.continent:hover { fill: #132237; }
.city-marker-group { cursor: pointer; }
.city-marker-group:hover { opacity: 0.9; }
.city-marker-group:hover .marker-label { opacity: 1; }
.marker-dot {
  stroke: #fff;
  stroke-width: 1.5;
  transition: r 0.2s;
}
.marker-dot:hover { r: 8; }
.marker-pulse {
  animation: pulse 2s ease-in-out infinite;
  transform-origin: center;
}
@keyframes pulse {
  0% { r: 4; opacity: 0.6; }
  50% { r: 12; opacity: 0.15; }
  100% { r: 4; opacity: 0.6; }
}
.marker-label {
  font-size: 10px;
  fill: var(--text-dim);
  pointer-events: none;
  text-anchor: middle;
  opacity: 0;
  transition: opacity 0.2s;
}
.tooltip {
  position: absolute; background: var(--panel); border: 1px solid var(--panel-border);
  padding: 8px 12px; border-radius: 8px; font-size: 12px;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
  z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.5); max-width: 200px;
}
.tooltip.show { opacity: 1; }
.tooltip-city { font-weight: 600; color: var(--text); margin-bottom: 2px; }
.tooltip-count { color: var(--text-dim); }
.detail-panel {
  position: absolute; right: 0; top: 0; width: 320px; height: 100%;
  background: var(--panel); border-left: 1px solid var(--panel-border);
  transform: translateX(100%); transition: transform 0.3s ease;
  z-index: 60; display: flex; flex-direction: column; overflow: hidden;
}
.detail-panel.open { transform: translateX(0); }
.detail-header {
  padding: 20px; border-bottom: 1px solid var(--panel-border);
  display: flex; justify-content: space-between; align-items: flex-start;
}
.detail-header h2 { font-size: 20px; font-weight: 700; }
.detail-header .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.close-btn {
  background: none; border: none; color: var(--text-dim); font-size: 24px;
  cursor: pointer; padding: 0; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px; transition: all 0.2s;
}
.close-btn:hover { background: var(--bg); color: var(--text); }
.detail-content { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
.band-item {
  padding: 14px 0; border-bottom: 1px solid var(--panel-border);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
}
.band-item:last-child { border-bottom: none; }
.band-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.band-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.band-year {
  font-size: 12px; color: var(--text-dim); background: var(--bg);
  padding: 2px 8px; border-radius: 4px;
}
.band-genre {
  font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500;
}
.band-genre.Emocore { background: rgba(231, 76, 60, 0.15); color: var(--Emocore); }
.band-genre.Midwest { background: rgba(26, 188, 156, 0.15); color: var(--Midwest); }
.band-genre.Screamo { background: rgba(192, 57, 43, 0.15); color: var(--Screamo); }
.band-genre.Emo-Pop { background: rgba(241, 196, 15, 0.15); color: var(--Emo-Pop); }
.band-genre.Pop-Punk { background: rgba(230, 126, 34, 0.15); color: var(--Pop-Punk); }
.band-genre.Post-HC { background: rgba(155, 89, 182, 0.15); color: var(--Post-HC); }
.band-genre.Math { background: rgba(46, 204, 113, 0.15); color: var(--Math); }
.band-genre.Indie { background: rgba(52, 152, 219, 0.15); color: var(--Indie); }
.band-genre.Revival { background: rgba(233, 30, 99, 0.15); color: var(--Revival); }
.mobile-toggle {
  display: none; position: fixed; bottom: 20px; right: 20px;
  width: 48px; height: 48px; background: var(--accent); border: none;
  border-radius: 50%; color: #fff; font-size: 20px; cursor: pointer;
  z-index: 90; box-shadow: 0 4px 20px var(--accent-glow);
}
@media (max-width: 1024px) {
  .sidebar { width: 240px; }
  .detail-panel { width: 280px; }
}
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .sidebar {
    width: 100%; border-right: none; border-bottom: 1px solid var(--panel-border);
    max-height: 200px; padding: 16px; gap: 16px;
  }
  .detail-panel {
    width: 100%; border-left: none; border-top: 1px solid var(--panel-border);
    transform: translateY(100%); top: auto; bottom: 0; height: 60vh;
  }
  .detail-panel.open { transform: translateY(0); }
  .stats { display: none; }
  .mobile-toggle { display: flex; align-items: center; justify-content: center; }
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
.intro-overlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 200; transition: opacity 0.6s, visibility 0.6s;
}
.intro-overlay.hidden { opacity: 0; visibility: hidden; }
.intro-overlay h1 { font-size: 42px; margin-bottom: 10px; letter-spacing: -1px; }
.intro-overlay p { color: var(--text-dim); font-size: 16px; margin-bottom: 30px; }
.start-btn {
  padding: 12px 32px; background: var(--accent); border: none; border-radius: 8px;
  color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }
</style>
</head>

const genreColors = {
  "Emocore": "#e74c3c",
  "Midwest": "#1abc9c",
  "Screamo": "#c0392b",
  "Emo-Pop": "#f1c40f",
  "Pop-Punk": "#e67e22",
  "Post-HC": "#9b59b6",
  "Math": "#2ecc71",
  "Indie": "#3498db",
  "Revival": "#e91e63"
};

let yearMin = 1983, yearMax = 2025;
let selectedGenres = new Set(["all"]);
let activeCity = null;

function lngToX(lng) { return (lng + 180) / 360 * 1000; }
function latToY(lat) { return (90 - lat) / 180 * 500; }

function getFilteredBands() {
  return bands.filter(function(b) {
    var inYear = b.year >= yearMin && b.year <= yearMax;
    var inGenre = selectedGenres.has("all") || selectedGenres.has(b.genre);
    return inYear && inGenre;
  });
}

function getCityBands(city) {
  return getFilteredBands().filter(function(b) { return b.city === city; }).sort(function(a, b) { return a.year - b.year; });
}

function getCitiesFromBands(bandList) {
  var cities = {};
  bandList.forEach(function(b) {
    if (!cities[b.city]) {
      cities[b.city] = { city: b.city, country: b.country, lat: b.lat, lng: b.lng, bands: [] };
    }
    cities[b.city].bands.push(b);
  });
  return Object.values(cities);
}

function renderMarkers() {
  var filtered = getFilteredBands();
  var cities = getCitiesFromBands(filtered);
  var group = document.getElementById("markersGroup");
  group.innerHTML = "";

  cities.forEach(function(cityData) {
    var x = lngToX(cityData.lng);
    var y = latToY(cityData.lat);
    var count = cityData.bands.length;
    var primaryGenre = cityData.bands[0].genre;
    var color = genreColors[primaryGenre] || "#e94560";
    var radius = 4 + Math.min(count, 6);

    var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "city-marker-group");
    g.setAttribute("data-city", cityData.city);

    // Pulse ring
    var pulse = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    pulse.setAttribute("cx", x);
    pulse.setAttribute("cy", y);
    pulse.setAttribute("r", radius);
    pulse.setAttribute("fill", color);
    pulse.setAttribute("class", "marker-pulse");
    g.appendChild(pulse);

    // Main dot
    var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", x);
    dot.setAttribute("cy", y);
    dot.setAttribute("r", radius);
    dot.setAttribute("fill", color);
    dot.setAttribute("stroke", "#fff");
    dot.setAttribute("stroke-width", "1.5");
    dot.setAttribute("class", "marker-dot");
    g.appendChild(dot);

    // Label
    var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("x", x);
    label.setAttribute("y", y - 12);
    label.setAttribute("class", "marker-label");
    label.textContent = cityData.city;
    g.appendChild(label);

    // Events on the group
    g.addEventListener("mouseenter", function(e) { showTooltip(e, cityData); });
    g.addEventListener("mouseleave", hideTooltip);
    g.addEventListener("click", function() { openDetail(cityData.city); });

    group.appendChild(g);
  });

  document.getElementById("stat-cities").textContent = cities.length;
  document.getElementById("stat-bands").textContent = filtered.length;
  document.getElementById("stat-range").textContent = yearMin + "–" + yearMax;
}

function renderLegend() {
  var container = document.getElementById("legendContainer");
  var filtered = getFilteredBands();
  var genreCounts = {};
  filtered.forEach(function(b) { genreCounts[b.genre] = (genreCounts[b.genre] || 0) + 1; });

  container.innerHTML = "";
  Object.entries(genreCounts).sort(function(a, b) { return b[1] - a[1]; }).forEach(function(item) {
    var genre = item[0], count = item[1];
    var div = document.createElement("div");
    div.className = "legend-item";
    div.innerHTML = '<div class="legend-dot" style="background:' + genreColors[genre] + '"></div>' + genre + ' <span style="color:var(--text-dim);margin-left:auto">' + count + '</span>';
    container.appendChild(div);
  });
}

function showTooltip(e, cityData) {
  var tooltip = document.getElementById("tooltip");
  tooltip.querySelector(".tooltip-city").textContent = cityData.city + ", " + cityData.country;
  tooltip.querySelector(".tooltip-count").textContent = cityData.bands.length + " 支乐队";
  tooltip.style.left = (e.clientX + 15) + "px";
  tooltip.style.top = (e.clientY - 10) + "px";
  tooltip.classList.add("show");
}

function hideTooltip() {
  document.getElementById("tooltip").classList.remove("show");
}

function openDetail(city) {
  var cityBands = getCityBands(city);
  if (cityBands.length === 0) return;

  activeCity = city;
  var panel = document.getElementById("detailPanel");
  var firstBand = bands.find(function(b) { return b.city === city; });

  document.getElementById("detailCity").textContent = city;
  document.getElementById("detailSubtitle").textContent = firstBand.country + " · " + cityBands.length + " 支乐队";

  var content = document.getElementById("detailContent");
  content.innerHTML = cityBands.map(function(b) {
    return '<div class="band-item">' +
      '<div class="band-info">' +
        '<h4>' + b.name + '</h4>' +
        '<div class="band-meta">' +
          '<span class="band-year">' + b.year + '</span>' +
          '<span class="band-genre ' + b.genre + '">' + b.genre + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  panel.classList.add("open");
}

function closeDetail() {
  document.getElementById("detailPanel").classList.remove("open");
  activeCity = null;
}

function updateSliderFill() {
  var range = 2025 - 1983;
  var left = ((yearMin - 1983) / range) * 100;
  var width = ((yearMax - yearMin) / range) * 100;
  var fill = document.getElementById("sliderFill");
  fill.style.left = left + "%";
  fill.style.width = width + "%";
}

document.getElementById("yearMin").addEventListener("input", function() {
  yearMin = parseInt(this.value);
  if (yearMin > yearMax) {
    yearMax = yearMin;
    document.getElementById("yearMax").value = yearMax;
  }
  document.getElementById("yearMinDisplay").textContent = yearMin;
  document.getElementById("yearMaxDisplay").textContent = yearMax;
  updateSliderFill();
  renderMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

document.getElementById("yearMax").addEventListener("input", function() {
  yearMax = parseInt(this.value);
  if (yearMax < yearMin) {
    yearMin = yearMax;
    document.getElementById("yearMin").value = yearMin;
  }
  document.getElementById("yearMinDisplay").textContent = yearMin;
  document.getElementById("yearMaxDisplay").textContent = yearMax;
  updateSliderFill();
  renderMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

document.getElementById("genreFilter").addEventListener("click", function(e) {
  if (!e.target.classList.contains("genre-btn")) return;
  var genre = e.target.dataset.genre;

  if (genre === "all") {
    selectedGenres = new Set(["all"]);
    document.querySelectorAll(".genre-btn").forEach(function(btn) { btn.classList.remove("active"); });
    e.target.classList.add("active");
  } else {
    if (selectedGenres.has("all")) {
      selectedGenres.delete("all");
      document.querySelector('.genre-btn[data-genre="all"]').classList.remove("active");
    }
    if (selectedGenres.has(genre)) {
      selectedGenres.delete(genre);
      e.target.classList.remove("active");
      if (selectedGenres.size === 0) {
        selectedGenres.add("all");
        document.querySelector('.genre-btn[data-genre="all"]').classList.add("active");
      }
    } else {
      selectedGenres.add(genre);
      e.target.classList.add("active");
    }
  }
  renderMarkers();
  renderLegend();
  if (activeCity) openDetail(activeCity);
});

var sidebarOpen = false;
function toggleSidebar() {
  var sidebar = document.querySelector(".sidebar");
  sidebarOpen = !sidebarOpen;
  if (sidebarOpen) {
    sidebar.style.position = "fixed";
    sidebar.style.top = "60px";
    sidebar.style.left = "0";
    sidebar.style.right = "0";
    sidebar.style.bottom = "0";
    sidebar.style.zIndex = "80";
    sidebar.style.maxHeight = "none";
  } else {
    sidebar.style.position = "";
    sidebar.style.top = "";
    sidebar.style.left = "";
    sidebar.style.right = "";
    sidebar.style.bottom = "";
    sidebar.style.zIndex = "";
    sidebar.style.maxHeight = "200px";
  }
}

// Initialize
updateSliderFill();
renderMarkers();
renderLegend();
</script>
